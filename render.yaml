services:
  - type: web
    name: forest-shared-site
    runtime: python
    plan: starter
    buildCommand: python -m compileall app.py
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: answers-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
